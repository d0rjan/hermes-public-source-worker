name: Scheduled Hermes public source worker
on:
  schedule:
    - cron: '47 */6 * * *'
permissions:
  contents: read
concurrency:
  group: hermes-public-source-worker
  cancel-in-progress: false
jobs:
  public-source-index:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HERMES_HOME: ${{ github.workspace }}/.hermes-public-worker
      HERMES_SOURCE_REVISION: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned official Hermes
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-source"
          git -C "$RUNNER_TEMP/hermes-source" checkout "$HERMES_SOURCE_REVISION"
          test "$(git -C "$RUNNER_TEMP/hermes-source" rev-parse HEAD)" = "$HERMES_SOURCE_REVISION"
          python -m pip install uv==0.12.6
          cd "$RUNNER_TEMP/hermes-source"
          uv sync --frozen --no-dev --no-default-groups
          echo "$RUNNER_TEMP/hermes-source/.venv/bin" >> "$GITHUB_PATH"
      - name: Native Hermes scheduled source collection
        run: python scheduled_entry.py
